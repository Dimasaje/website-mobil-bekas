<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Bintang Mobil Bekas</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family-sans);
      background-color: var(--color-bg-canvas);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }
    .login-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .brand-icon {
      font-size: 2.5rem;
      margin-bottom: var(--space-2);
      display: inline-block;
    }
    .login-brand h1 {
      font-size: var(--font-size-2xl);
      color: var(--color-primary);
    }
    .login-brand p {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
    }
    .form-control {
      width: 100%;
      min-height: 48px;
      padding: 0 var(--space-3);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      background: var(--color-bg-surface);
      outline: none;
    }
    .form-control:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-100);
    }

    .btn {
      width: 100%;
      min-height: 48px;
      border-radius: var(--radius-md);
      font-size: var(--font-size-base);
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--color-primary);
      color: #FFF;
      margin-top: var(--space-4);
    }
    .btn:hover { background: var(--color-primary-hover); }

    .alert-error {
      background: var(--color-feedback-error-bg);
      color: var(--color-feedback-error-text);
      border: 1px solid #FCA5A5;
      padding: var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <span class="brand-icon">🚗</span>
      <h1>Bintang Mobil</h1>
      <p>Portal Pengelolaan Admin</p>
    </div>

    <!-- Alert Preview Error -->
    <div class="alert-error">
      ⚠️ <strong>Gagal Masuk:</strong> Email atau kata sandi tidak cocok.
    </div>

    <form action="dashboard.html" method="get">
      <div class="form-group">
        <label class="form-label">Email Administrator</label>
        <input type="email" class="form-control" placeholder="admin@bintangmobil.com" value="admin@bintangmobil.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Kata Sandi (Password)</label>
        <input type="password" class="form-control" value="password123" required>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; font-size: var(--font-size-xs);">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" checked> Ingat sesi saya
        </label>
        <span style="color: var(--color-text-muted);">Sesi cookie httpOnly</span>
      </div>

      <button type="submit" class="btn">Masuk ke Dashboard</button>
    </form>
  </div>

</body>
</html>
